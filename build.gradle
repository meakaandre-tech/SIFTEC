plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // JEI's API, for the plugin that marks locked recipes
    exclusiveContent {
        forRepository { maven { url = "https://maven.blamejared.com" } }
        filter { includeGroup "mezz.jei" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Create Fly, built from the pack-26.3 branch of the fork and downloaded by CI into libs/
    compileOnly files("libs/create-fly-26.3.jar")
    // the same JEI build Create Fly compiles against; only needed to compile, JEI itself is optional in game
    compileOnly("mezz.jei:jei-26.1.2-fabric:29.6.2.31") { transitive = false }

}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

