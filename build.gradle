plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // JEI's API, for the plugin that marks locked recipes
    exclusiveContent {
        forRepository { maven { url = "https://maven.blamejared.com" } }
        filter { includeGroup "mezz.jei" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Create Fly, built from the pack-26.3 branch of the fork and downloaded by CI into libs/
    compileOnly files("libs/create-fly-26.3.jar")
    // Create: New Age, built from the fabric-26.3 branch of the fork and downloaded by CI into libs/: the grid's wires,
    // connectors, motors and reactor
    compileOnly files("libs/create-new-age-26.3.jar")
    // MapMod (meakaandre-tech/MapMod), the map: compass, minimap and fullscreen map; SIFTEC adds its POIs, companies and
    // the Field Research unlock through its API (mapapi/). The latest release, downloaded by CI into libs/
    compileOnly files("libs/mapmod-26.3.jar")
    // Create: Diesel Generators, the fabric-26.3 build of the fork, downloaded by CI into libs/: the Fuel Generator's engine
    // (mixin/DieselEngineMixin, in the optional siftec.cdg.mixins.json; nothing else touches its classes)
    compileOnly files("libs/createdieselgenerators-26.3.jar")
    // Traveler's Backpack (and what it needs), downloaded by CI into libs/tb/compile: the pack's inventory (compat/)
    compileOnly fileTree(dir: "libs/tb/compile", include: "*.jar")
    // the same JEI build Create Fly compiles against; only needed to compile, JEI itself is optional in game
    compileOnly("mezz.jei:jei-26.1.2-fabric:29.6.2.31") { transitive = false }

}

// The selftests (/siftec selftest and worldtest) are their own mod, siftec_selftest, built into a separate jar that
// only the CI smoke run loads; the release jar holds none of their code.
sourceSets {
    selftest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        siftec {
            sourceSet sourceSets.main
        }
        siftec_selftest {
            sourceSet sourceSets.selftest
        }
    }
    runs {
        // the client the smoke run joins with: the mod and its selftests
        selftestClient {
            client()
            source sourceSets.selftest
            ideConfigGenerated false
        }
    }
}

def selftestJar = tasks.register("selftestJar", Jar) {
    archiveBaseName = "${project.archives_base_name}-selftest"
    from sourceSets.selftest.output
}

tasks.named("assemble") {
    dependsOn selftestJar
}

tasks.withType(ProcessResources).configureEach {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

